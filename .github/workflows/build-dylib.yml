# Build libShell.dylib on macOS; upload workflow artifact.
# GitHub Releases only for semver tag pushes (v*.*.*) whose commit is on main.
# Untagged pushes to main / PRs build + artifact only — never tag or Release.

name: Build libShell.dylib

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 iphoneos dylib
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build libShell.dylib
        run: make clean && make
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"

      - name: Verify Mach-O platform and min OS
        run: |
          set -euo pipefail
          file libShell.dylib
          echo "--- version load commands ---"
          otool -l libShell.dylib | grep -A6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'
          # Expect deployment target 14.0 from -miphoneos-version-min=14.0
          if otool -l libShell.dylib | grep -E 'minos 14\.0|version 14\.0' >/dev/null; then
            echo "[+] min OS 14.0 confirmed"
          else
            echo "[!] Expected min OS 14.0 in LC_BUILD_VERSION / LC_VERSION_MIN_IPHONEOS"
            exit 1
          fi

      - name: Upload libShell.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libShell-dylib
          path: libShell.dylib
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "[!] Refusing Release: ${GITHUB_SHA} is not on origin/main"
            exit 1
          fi
          echo "[+] Tagged commit ${GITHUB_SHA} is on origin/main"
          echo "[+] Tag ${GITHUB_REF_NAME}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: libShell-dylib

      - name: Publish Release with libShell.dylib
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f libShell.dylib
          # Do not create tags here — only attach a Release to the pushed tag.
          # Failed builds never reach this job (needs: build).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "[!] Release ${GITHUB_REF_NAME} already exists; uploading asset only if missing"
            gh release upload "${GITHUB_REF_NAME}" libShell.dylib --clobber
          else
            gh release create "${GITHUB_REF_NAME}" libShell.dylib \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
